OCAMLC := /home/piero/.opam/LTS/bin/ocamlc.opt -safe-string -strict-formats -strict-sequence
OCAMLC_UNSAFE := /home/piero/.opam/LTS/bin/ocamlc.opt
OCAMLSTDLIB := /home/piero/.opam/LTS/lib/ocaml


ACME := /home/piero/.opam/LTS/bin/acme
BINDIR := /home/piero/.opam/LTS/bin
LIBDIR := /home/piero/.opam/LTS/lib/bcaml
MAN1DIR := /home/piero/.opam/LTS/man/man1
MAN3DIR := /home/piero/.opam/LTS/man/man3

VERSION := 0.2.0-alpha

# Progress message for make recipes: coloured only if make's stdout is a
# terminal (GNU make >= 4.1 sets MAKE_TERMOUT) and NO_COLOR is not set
ifdef MAKE_TERMOUT
ifndef NO_COLOR
message = printf '\033[32m%s\033[0m %s\n' '$(1)' '$(2)'
endif
endif
message ?= printf '%s %s\n' '$(1)' '$(2)'
